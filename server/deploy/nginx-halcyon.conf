# Reverse proxy for the Halcyon backend.
# Install to /etc/nginx/sites-available/halcyon and symlink into sites-enabled,
# then run certbot --nginx -d halcyon.example.com to add the certificate.

server {
	listen 80;
	listen [::]:80;
	server_name halcyon.example.com;

	location / {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}

	# Heartbeats are frequent and small; keep bodies tiny to blunt abuse.
	client_max_body_size 32k;
}

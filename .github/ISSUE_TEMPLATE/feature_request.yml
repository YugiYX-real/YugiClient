name: Feature request
description: Suggest an improvement to Halcyon.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: Describe the behaviour you have in mind.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Instances and launching
        - Mods, shaders and resource packs
        - Accounts and skins
        - Java and downloads
        - Interface and theming
        - Plugins and API
        - Packaging and updates
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other launchers, workarounds, or why the existing options fall short.

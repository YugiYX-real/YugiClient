name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, for example v1.2.3"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v1.2.3"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  prepare:
    name: Resolve version and changelog
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        shell: bash
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          PREVIOUS="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          {
            echo "## Halcyon ${{ steps.resolve.outputs.version }}"
            echo
            if [ -n "${PREVIOUS}" ]; then
              echo "### Changes since ${PREVIOUS}"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS}..${TAG}" || \
                git log --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS}..HEAD"
            else
              echo "### Initial release"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' | head -n 100
            fi
            echo
            echo
            echo "Build ${{ github.run_number }} · commit ${GITHUB_SHA::7}"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Reserve the release before the matrix uploads assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node scripts/github-api.mjs \
            release-reserve \
            "${{ steps.resolve.outputs.tag }}" \
            "Halcyon ${{ steps.resolve.outputs.version }}" \
            RELEASE_NOTES.md

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 30

  publish:
    name: Publish ${{ matrix.label }} assets
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(vars.RELEASE_MATRIX || '{"include":[{"label":"windows","flag":"--win","runner":"windows-latest"},{"label":"linux","flag":"--linux","runner":"ubuntu-latest"},{"label":"macos","flag":"--mac","runner":"macos-latest"}]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for the companion mod
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build the companion mod
        working-directory: companion
        shell: bash
        run: gradle build --no-daemon

      - name: Stage the companion mod for packaging
        shell: bash
        run: |
          mkdir -p build/companion
          staged=0
          for jar in companion/build/libs/*.jar; do
            [ -f "${jar}" ] || continue
            case "${jar}" in
              *-sources.jar | *-dev.jar | *-dev-shadow.jar) continue ;;
            esac
            cp "${jar}" build/companion/
            staged=$((staged + 1))
          done
          if [ "${staged}" -eq 0 ]; then
            echo "The companion mod produced no shippable jar" >&2
            exit 1
          fi
          ls -l build/companion

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inject version number
        run: npm run version:inject -- ${{ needs.prepare.outputs.tag }}

      - name: Run the full verification suite
        run: npm run verify

      - name: Build application
        run: npm run build

      - name: Generate branding assets
        run: npm run assets:icons

      - name: Package and upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder ${{ matrix.flag }} --publish always

      - name: Archive artifacts for this run
        uses: actions/upload-artifact@v7
        with:
          name: halcyon-${{ needs.prepare.outputs.version }}-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Publish the GitHub Release
    needs: [prepare, publish]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Note incomplete platform coverage
        if: ${{ needs.publish.result != 'success' }}
        shell: bash
        run: |
          {
            echo
            echo "> Not every platform finished building for this tag. Missing downloads will"
            echo "> appear once that platform is rebuilt."
          } >> RELEASE_NOTES.md

      - name: Publish release with generated notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          node scripts/github-api.mjs \
            release-publish \
            "${{ needs.prepare.outputs.tag }}" \
            "Halcyon ${{ needs.prepare.outputs.version }}" \
            RELEASE_NOTES.md

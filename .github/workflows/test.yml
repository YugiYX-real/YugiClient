name: Test

# The Build workflow already lints, type checks and tests every push on Linux,
# so this workflow exists for the cross platform sweep only. Running it on
# every push meant paying twice for Linux, twice over for Windows and ten times
# over for macOS, which is why it is now asked for rather than automatic.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      allPlatforms:
        description: "Verify on Windows and macOS as well as Linux"
        required: false
        default: false
        type: boolean

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.TEST_MATRIX || (inputs.allPlatforms && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]')) }}
    steps:
      - name: Use unix line endings for every checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report formatting drift
        continue-on-error: true
        run: npm run format:check

      - name: Static analysis
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

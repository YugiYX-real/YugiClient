name: Diagnostic verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/diagnose.json"

concurrency:
  group: diagnostic-verification
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Capture verification output
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run install, verification and build
        id: diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          (
            npm install --no-audit --no-fund
            npm run verify
            npm run build
          ) 2>&1 | tee diagnostic.log

      - name: Publish failure report
        if: steps.diagnostic.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "Automated verification for commit \`${GITHUB_SHA}\` failed."
            echo
            echo '```text'
            if [ -f diagnostic.log ]; then
              tail -c 60000 diagnostic.log
            else
              echo "The diagnostic command did not create a log."
            fi
            echo
            echo '```'
          } > diagnostic-issue.md
          node scripts/github-api.mjs \
            issue-create \
            "CI diagnostic ${GITHUB_SHA::7} (failure)" \
            diagnostic-issue.md

      - name: Publish success report
        if: steps.diagnostic.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "Automated verification for commit \`${GITHUB_SHA}\` succeeded."
            echo
            echo '```text'
            tail -c 12000 diagnostic.log
            echo
            echo '```'
          } > diagnostic-issue.md
          node scripts/github-api.mjs \
            issue-create \
            "CI diagnostic ${GITHUB_SHA::7} (success)" \
            diagnostic-issue.md

      - name: Preserve failure status
        if: steps.diagnostic.outcome != 'success'
        shell: bash
        run: exit 1

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      binaries:
        description: "Also package installers for every platform"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  bundle:
    name: Bundle and test
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    steps:
      - name: Use unix line endings for every checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report formatting drift
        continue-on-error: true
        run: npm run format:check

      - name: Static analysis
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build renderer, preload and main
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-bundle
          path: out
          retention-days: 7

  # Packaging installers is by far the most expensive thing this repository can
  # do, and on a private repository macOS runners bill at ten times the Linux
  # rate. Nothing here runs unless it is asked for by hand, because a release
  # already produces the installers that matter.
  binaries:
    name: Binaries for ${{ matrix.label }}
    needs: bundle
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.binaries && vars.SKIP_BINARY_MATRIX != 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(vars.BINARY_MATRIX || '{"include":[{"label":"windows","flag":"--win","runner":"windows-latest"}]}') }}
    steps:
      - name: Use unix line endings for every checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Generate branding assets
        run: npm run assets:icons

      - name: Package unsigned binaries
        run: npx --no-install electron-builder ${{ matrix.flag }} --publish never

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: halcyon-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

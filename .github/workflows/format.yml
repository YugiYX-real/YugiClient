name: Format

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prettier:
    name: Apply Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the pinned Prettier version
        id: prettier
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').devDependencies.prettier.replace(/^[^0-9]+/, '')")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Formatting with Prettier ${VERSION}"

      - name: Apply Prettier
        run: npx --yes prettier@${{ steps.prettier.outputs.version }} --write .

      - name: Commit formatting
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Every file already matches the Prettier configuration."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply prettier formatting"
          git push

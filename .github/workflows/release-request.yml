name: Release request

on:
  push:
    branches: [main]
    paths: [".github/release.json"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, for example v1.0.0"
        required: true
        type: string

concurrency:
  group: release-request
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Create the release tag
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-latest"') }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve the requested tag
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('.github/release.json','utf8')).tag||''))")"
          fi
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${TAG}' is not a valid release tag. Use the vMAJOR.MINOR.PATCH form."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Requested release ${TAG}"

      - name: Point the tag at the requested commit
        shell: bash
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            EXISTING="$(git rev-list -n 1 "refs/tags/${TAG}")"
            if [ "${EXISTING}" = "${GITHUB_SHA}" ]; then
              echo "Tag ${TAG} already points at this commit."
            else
              echo "Moving ${TAG} from ${EXISTING} to ${GITHUB_SHA}."
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "${TAG}" -m "Halcyon ${TAG#v}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${TAG}"

  release:
    name: Build and publish
    needs: tag
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
